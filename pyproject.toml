[project]
name = "dartwork-limn"
dynamic = ["version"]
description = "Limn: pin a spot in a manuscript PDF and get the source lines back; a revision loop for people and agents"
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "Dartwork" }]
classifiers = [
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Environment :: Web Environment",
    "Topic :: Text Processing :: Markup :: LaTeX",
]
dependencies = []

[project.scripts]
limn = "limn.cli:main"

[dependency-groups]
dev = ["pytest>=8", "playwright>=1.47", "ruff>=0.16", "shellcheck-py>=0.11", "mypy>=2.3"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/limn/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/limn"]

[tool.hatch.build.targets.sdist]
include = ["src/limn", "tests", "docs", "skill", "README.md", "README.ko.md", "LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = ["src/limn/vendor", "tools/handbook-publish"]   # copied from upstream; fix there, not here

[tool.ruff.lint]
# Stage 1 of docs/handbook/code-style-roadmap.md: bug-candidate rules only. Style rules ("W", "I", "UP",
# "SIM") and docstrings ("D") come later, with the whole-tree reformat in its own commit.
select = ["F", "E4", "E7", "E9", "B", "PLW1510"]

[tool.mypy]
# Stage 7 of docs/handbook/code-style-roadmap.md, started early: the modules already moved out of server.py and the
# `limn` command (cli.py, migrate.py, the package files) are type-checked strictly; the list widens as modules move.
# `uv run mypy` reports errors in exactly these files. cli.py imports server.py: mypy reads its signatures to check the
# calls, but does not report server.py's own errors.
files = ["src/limn/pins", "src/limn/guidance.py", "src/limn/mapping.py", "src/limn/build.py", "src/limn/files.py", "src/limn/store.py", "src/limn/mark.py", "src/limn/web", "src/limn/scope.py", "src/limn/revisions.py", "src/limn/documents.py", "src/limn/outline.py", "src/limn/meta.py", "src/limn/cli.py", "src/limn/migrate.py", "src/limn/__init__.py", "src/limn/__main__.py"]
mypy_path = "src"
python_version = "3.10"
strict = true
# A `match` over a union that misses a case is an error, not just a missing return (docs/handbook/verification.md §9).
enable_error_code = ["exhaustive-match"]
