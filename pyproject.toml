[project]
name = "dartwork-limn"
dynamic = ["version"]
description = "Limn: pin a spot in a manuscript PDF and get the source lines back; a revision loop for people and agents"
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "Dartwork" }]
classifiers = [
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Environment :: Web Environment",
    "Topic :: Text Processing :: Markup :: LaTeX",
]
dependencies = []

[project.scripts]
limn = "limn.cli:main"

[dependency-groups]
dev = ["pytest>=8", "playwright>=1.47"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/limn/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/limn"]

[tool.hatch.build.targets.sdist]
include = ["src/limn", "tests", "docs", "skill", "README.md", "README.ko.md", "LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
