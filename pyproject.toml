[project]
name = "dartwork-limn"
dynamic = ["version"]
description = "Limn: pin a spot in a manuscript PDF and get the source lines back; a revision loop for people and agents"
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "Dartwork" }]
classifiers = [
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Environment :: Web Environment",
    "Topic :: Text Processing :: Markup :: LaTeX",
]
dependencies = []

[project.scripts]
limn = "limn.cli:main"

[dependency-groups]
dev = ["pytest>=8", "playwright>=1.47", "ruff>=0.16", "shellcheck-py>=0.11", "mypy>=2.3"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/limn/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/limn"]

[tool.hatch.build.targets.sdist]
include = ["src/limn", "tests", "docs", "skill", "README.md", "README.ko.md", "LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = ["src/limn/vendor", "tools/handbook-publish"]   # copied from upstream; fix there, not here

[tool.ruff.lint]
# Stage 1 of docs/handbook/code-style-roadmap.md (R4): bug candidates ("F", "B", "PLW1510") and style rules ("E",
# "W", "I", "UP", "SIM"); `ruff format` owns the layout. Docstring rules ("D") come later, new modules first.
select = ["F", "E", "W", "I", "B", "UP", "SIM", "PLW1510"]
ignore = [
    "E501",   # line length: the formatter wraps code; long comment and docstring lines are not checked
    "UP030",  # str.format templates keep their explicit field numbers ...
    "UP031",  # ... printf-style strings stay printf-style ...
    "UP032",  # ... and .format() calls are not rewritten to f-strings: the messages are agent contract bytes
    "UP042",  # `class X(str, Enum)` -> StrEnum changes str() and format() of the members
]

[tool.ruff.lint.per-file-ignores]
# The limn.* imports follow the sys.path bootstrap that lets an instance run the file directly.
"src/limn/server.py" = ["E402"]

[tool.ruff.lint.isort]
combine-as-imports = true               # `from limn import access, server as ps` stays one line, as the code writes it
known-local-folder = ["helpers", "test_*"]   # the tests' shared modules, imported after limn

[tool.mypy]
# Stage 7 of docs/handbook/code-style-roadmap.md: every module of the package is type-checked strictly - the modules
# moved out of server.py, server.py itself (the composition root; its module is also checked against the handler's
# limn.web.app.App Protocol), and the `limn` command (cli.py, migrate.py, the package files). `uv run mypy` reports
# errors in exactly these files; a new module is added here.
files = ["src/limn"]
mypy_path = "src"
python_version = "3.10"
strict = true
# A `match` over a union that misses a case is an error, not just a missing return (docs/handbook/verification.md §9).
enable_error_code = ["exhaustive-match"]
