[project]
name = "dartwork-limn"
dynamic = ["version"]
description = "Limn: pin a spot in a manuscript PDF and get the source lines back; a revision loop for people and agents"
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "Dartwork" }]
classifiers = [
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Environment :: Web Environment",
    "Topic :: Text Processing :: Markup :: LaTeX",
]
dependencies = []

[project.scripts]
limn = "limn.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "playwright>=1.47",
    "ruff>=0.16",
    "shellcheck-py>=0.11",
    "pytest-xdist>=3.8.0",
    "hypothesis>=6.168.3",
    "basedpyright>=1.40.2",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/limn/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/limn"]
exclude = ["**/tests/**", "**/test_*.py", "src/limn/viewer/types/**"]

[tool.hatch.build.targets.sdist]
include = ["src/limn", "tests", "conftest.py", "tools", "docs", "skill", "README.md", "README.ko.md", "LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]

[tool.pytest.ini_options]
testpaths = ["tests", "src/limn"]
pythonpath = ["tests/support"]
# Keep class-scoped browser resources together; -n 0 remains available for debugging.
addopts = "--import-mode=importlib -n 4 --dist loadscope"
markers = [
    "tex: runs real TeX-side tools (tests/support/helpers.py needs_tex); the CI tex job selects these with -m tex",
    "browser: launches Chromium, Firefox, or WebKit (tests/support/helpers_browser.py); -m 'not browser' runs the rest",
]

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = ["src/limn/vendor", "tools/handbook-publish"]   # copied from upstream; fix there, not here

[tool.ruff.lint]
# Coding rule R4 (docs/handbook/code-style-roadmap.md §R4): bug candidates ("F", "B", "PLW1510") and style rules
# ("E", "W", "I", "UP", "SIM"); `ruff format` owns the layout. D100-D107 cover production code; D100-D101 also cover tests.
select = ["F", "E", "W", "I", "B", "UP", "SIM", "PLW1510", "D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107"]
ignore = [
    "E501",   # line length: the formatter wraps code; long comment and docstring lines are not checked
    "UP030",  # str.format templates keep their explicit field numbers ...
    "UP031",  # ... printf-style strings stay printf-style ...
    "UP032",  # ... and .format() calls are not rewritten to f-strings: the messages are agent contract bytes
    "UP042",  # `class X(str, Enum)` -> StrEnum changes str() and format() of the members
]

[tool.ruff.lint.per-file-ignores]
# The limn.* imports follow the sys.path bootstrap that lets an instance run the file directly.
"src/limn/server.py" = ["E402"]
# Every test module and class has a docstring; function and method coverage still has legacy gaps.
"tests/**/*.py" = ["D102", "D103", "D104", "D105", "D106", "D107"]
"src/limn/**/test_*.py" = ["D102", "D103", "D104", "D105", "D106", "D107"]

[tool.ruff.lint.isort]
combine-as-imports = true               # `from limn import access, server as ps` stays one line, as the code writes it
known-local-folder = ["helpers", "helpers_*", "test_*"]   # the tests' shared modules, imported after limn

[tool.basedpyright]
# Coding rule R8 (docs/handbook/code-style-roadmap.md §R8): every production module under src/limn is checked in
# basedpyright's strictest mode, as Linux here and as macOS with --pythonplatform Darwin (tools/check_types.py runs
# both). Colocated tests and vendored code are not checked. Errors that existed when the gate came in are recorded in
# .basedpyright/baseline.json, which may only shrink (docs/handbook/verification.md §9); a new error fails.
include = ["src/limn"]
exclude = ["src/limn/vendor", "**/tests", "**/test_*.py", "**/__pycache__"]
pythonVersion = "3.10"
pythonPlatform = "Linux"
typeCheckingMode = "all"
# A `# type: ignore` comment silences nothing: the only escape is the reviewed baseline (`# pyright: ignore` is
# rejected by tools/check_fitness.py).
enableTypeIgnoreComments = false
# Rules "all" turns on that this project turns off, one reason each:
# @override is typing.override (Python 3.12) or typing_extensions; the runtime is Python 3.10 and the standard library.
reportImplicitOverride = false
# Layout, not types: Ruff format owns it, and adjacent literals are how the formatter wraps long contract messages.
reportImplicitStringConcatenation = false
# A discarded return value (os.write, list.pop, dict.setdefault) is not a type defect; unused coroutines and
# expressions are still reported.
reportUnusedCallResult = false
# Cycles between slices are tools/check_boundaries.py's; pyright also counts TYPE_CHECKING-only imports, so every lazy
# slice surface (docs/handbook/architecture.md §의존 방향) would read as a cycle that never runs.
reportImportCycles = false
