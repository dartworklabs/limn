# Bumps the SHA-pinned actions in .github/workflows/ (and the tag comment beside each) and the viewer's npm dev tools once a week.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # The viewer's type checker (package.json devDependencies); nothing here ships with Limn.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
