name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new PR revision supersedes that PR's older read-only checks. Main runs keep a unique group so every integration
# tree is validated. A release tag does not run: it points at the merge commit whose push to main has just run the
# whole workflow on that same tree, and nothing reads a tag's run (`limn update` installs a tag without asking CI).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

# Every job reads only. Third-party actions are pinned to a commit SHA (the tag in the comment is for people and
# Dependabot), and checkout keeps no token in .git/config: no step pushes or fetches after it
# (tests/architecture/test_ci_pins.py).
permissions:
  contents: read

# Linux jobs name their image. `ubuntu-latest` moves to the next release on GitHub's schedule, which would change
# the system packages under Playwright's `--with-deps`, bwrap and the shell tests without any change here. Move to a
# newer image in its own pull request, where a failure is attributable to the image.
#
# A stuck job fails instead of holding a runner for GitHub's six-hour default. Each job's `timeout-minutes` (the browser
# parts' in browser.yml too) is about twice its usual length and never under 15 minutes, and the steps that download
# from the Ubuntu archive have their own shorter limit, so the step that stalled is the one marked failed. Every pytest
# run sets `faulthandler_timeout`: a test still running after 600 seconds prints the stack of every thread, which names
# the test and the line it is waiting on, while the run carries on. The slowest browser test takes a little over two
# minutes on a fast machine, and each job's limit leaves those 600 seconds after the job's usual length, so a test that
# hangs late in a job still prints its stack before the limit stops the job.
jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.23"
      - name: Install dev dependencies
        run: uv sync --group dev --locked
      - name: Ruff
        run: uv run ruff check
      - name: Ruff format
        run: uv run ruff format --check
      - name: ShellCheck
        run: uv run shellcheck src/limn/administration/instances.sh src/limn/administration/instance_*.sh src/limn/administration/tests/test_instances.sh
      - name: Mypy
        run: uv run mypy
      # Contributors type-check on macOS too, where the standard library declares fewer names (os.sched_getaffinity):
      # check that platform from here as well, so a checkout is clean on both.
      - name: Mypy (as on macOS)
        run: uv run mypy --platform darwin
      - name: Feature boundaries
        run: uv run python tools/check_boundaries.py
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Install viewer type checker
        run: npm ci --ignore-scripts
      - name: Viewer type check
        run: npm run typecheck
      - name: Viewer strict ratchet
        run: uv run python tools/strict_ratchet.py

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
        # The browser suite runs in parts, on 3.12 only (browser-3-12 below). The suite keeps its three values: every
        # matrix value is part of the job's name, which branch protection requires as is.
        suite:
          - name: core
            markers: "not browser and not tex"
            workers: 4
    env:
      # The node --check of the served page's inline scripts (src/limn/viewer/tests/test_viewer_files.py) must run here: node 22 is set up below.
      LIMN_TEST_REQUIRE_NODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history and tags: the v0.1.0 migration and v0.2.2 comparison tests load those releases with git show.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.23"
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Install dev dependencies
        run: uv sync --group dev --locked
      - name: Python tests
        run: uv run pytest -q -rs -n ${{ matrix.suite.workers }} -m "${{ matrix.suite.markers }}" -o faulthandler_timeout=600

  # The browser suite, in jobs on their own runners (browser.yml: the Chromium classes in parts, the Firefox and WebKit
  # classes in one job), on Python 3.12 only. It tests the viewer's JS in a browser; running it on a second Python
  # version doubled its cost for little signal. Python 3.10 stays covered by the core suite above on 3.10, by the lint
  # job's Ruff and mypy (both target 3.10) and by the instances job's check of the 3.10 floor. A server path that only a
  # browser test reaches no longer runs on 3.10.
  browser-3-12:
    name: browser (3.12)
    uses: ./.github/workflows/browser.yml
    with:
      python: "3.12"

  # Branch protection requires the name the unsplit 3.12 browser job had (its matrix values: Python, suite, markers,
  # workers). It passes only when every job of the suite passed: a failed, cancelled or skipped part fails it.
  # `always()` runs it in those cases too - a job skipped by its condition reports success, which a required check takes
  # as a pass.
  browser-result-3-12:
    name: test (3.12, browser, browser, 2)
    needs: browser-3-12
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Every job of the 3.12 browser suite passed
        env:
          RESULT: ${{ needs.browser-3-12.result }}
        run: |
          echo "browser (3.12): $RESULT"
          [ "$RESULT" = success ]

  macos:
    # macOS semantics for tests that need no TeX or Chromium: BSD
    # userland (stat -f, no timeout(1)), /bin/bash 3.2 as the bash limn and the tests find first, and a system
    # python3 older than requires-python (issue #12). The Linux jobs cover bash 5 and the browser tests.
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.23"
          python-version: "3.12"
      - name: Install dev dependencies
        run: uv sync --group dev --locked
      - name: Put /bin/bash 3.2 first on PATH
        run: |
          mkdir -p "$RUNNER_TEMP/bash32"
          ln -sf /bin/bash "$RUNNER_TEMP/bash32/bash"
          echo "$RUNNER_TEMP/bash32" >> "$GITHUB_PATH"
      - name: Show the tools under test
        run: |
          bash --version | head -1
          /usr/bin/python3 --version || true
          command -v timeout || echo "no timeout(1)"
          stat -f %Lp README.md
      - name: Python tests
        # One worker per CPU: macos-latest hands out 3-core M1 and 5-core M2 Pro machines, and two workers left a
        # core idle on the 3-core ones (206.9 s at -n 2, 159.9 s at -n 3 on the same M1).
        run: uv run pytest -q -rs -n auto -m "not browser and not tex" -o faulthandler_timeout=600

  macos-browser:
    # Native Apple shortcuts and caret navigation need a real macOS browser;
    # injected navigator.platform fixtures alone do not exercise the OS keys.
    # The same host catches fallback ink and verifies test fonts are page-scoped.
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      LIMN_TEST_REQUIRE_BROWSER: "1"
      LIMN_TEST_REQUIRE_NODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.23"
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Install dev dependencies
        run: uv sync --group dev --locked
      # The page-scoped Hangul test font (tests/support/helpers_browser_font.py) is fetched here, before the tests, and kept
      # under actions/cache by its pinned source: no test reads it from GitHub raw, where a read once timed out inside four
      # tests of a part. The fetch tries three times, a bounded wait apart; LIMN_TEST_FONT_PREFETCHED=1 on the test step
      # makes a test whose cache is cold fail rather than download. Every read still checks the pinned SHA-256.
      - name: Restore the browser test font
        id: test-font
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/browser-test-font
          key: browser-test-font-${{ hashFiles('tests/fixtures/browser-font/SOURCE.json') }}
      - name: Fetch the browser test font
        timeout-minutes: 5
        env:
          LIMN_TEST_FONT_CACHE: ${{ runner.temp }}/browser-test-font
        run: uv run python tests/support/helpers_browser_font.py
      - name: Keep the browser test font
        if: steps.test-font.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/browser-test-font
          key: ${{ steps.test-font.outputs.cache-primary-key }}
      - name: Install native Chromium
        run: uv run playwright install chromium
      - name: Native browser keyboard journeys and fallback ink
        env:
          LIMN_TEST_FONT_CACHE: ${{ runner.temp }}/browser-test-font
          LIMN_TEST_FONT_PREFETCHED: "1"
        run: >-
          uv run pytest -q -rs -n 2 -m browser -o faulthandler_timeout=600
          src/limn/viewer/tests/test_viewer_search.py::SearchKeys
          src/limn/viewer/tests/test_viewer_search.py::SearchShortcutFocus
          src/limn/viewer/tests/test_viewer_search.py::SearchScope
          src/limn/viewer/tests/test_viewer_search.py::SearchInk::test_the_fields_text_is_on_its_neighbours_line_in_fallback_fonts
          src/limn/viewer/tests/test_viewer_doc_overflow.py::WithSearch
          src/limn/viewer/tests/test_viewer_assignee.py::TwoPeopleWithOneName
          src/limn/viewer/tests/test_viewer_input.py::HangulInkInClippingBoxes
          src/limn/viewer/tests/test_viewer_size_alignment.py::LabelInkCentre
          tests/test_browser_font.py::BrowserFontProvision

  instances:
    # Machine-wide dependencies are replaced at the owned shell adapter; each run has its own temporary tree.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.23"
          python-version: "3.12"
      - name: Install dev dependencies
        run: uv sync --group dev --locked
      - name: Instance manager tests
        run: bash src/limn/administration/tests/test_instances.sh

  install:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.23"
      - name: Install as a uv tool from the checkout
        run: uv tool install .
      - name: Smoke-test the installed command
        run: |
          limn version
          limn serve --help | head -3
          limn serve --version
          limn help | head -5
          python_dir=$(uv tool dir)/dartwork-limn
          # Each missing file fails the step (a `find | grep -q . && echo` line only fails it when it is the last one).
          for f in vendor/pdfjs/pdf.min.mjs vendor/pretendard/LICENSE vendor/pretendard/pretendard.css \
                   vendor/pretendard/PretendardVariable.subset.0.woff2 administration/systemd/limn@.service administration/instances.sh \
                   administration/instance_update.sh administration/instance_documents.sh \
                   administration/instance_lifecycle.sh administration/instance_inspection.sh \
                   viewer/index.html viewer/parts.txt viewer/css/tokens.css viewer/js/events.js \
                   viewer/brand/SHA256SUMS viewer/brand/favicon.ico viewer/brand/favicon-16.png viewer/brand/favicon-32.png viewer/brand/apple-touch-icon.png \
                   viewer/brand/limn-wordmark-light-20.svg; do
            find "$python_dir" -path "*limn/$f" | grep -q . || { echo "not packaged: $f"; exit 1; }
            echo "packaged: $f"
          done
          # Every Pretendard slice the stylesheet names, byte for byte: SHA256SUMS lists them all, so a slice the wheel
          # dropped fails here instead of drawing its characters in a fallback font.
          fonts=$(dirname "$(find "$python_dir" -path "*limn/vendor/pretendard/SHA256SUMS")")
          (cd "$fonts" && sha256sum --check --quiet SHA256SUMS) || { echo "Pretendard slices missing or changed"; exit 1; }
          echo "packaged: $(wc -l < "$fonts/SHA256SUMS") Pretendard slices"
          # What start() reads before it serves: the viewer package and every brand file limn.viewer.mark names. A file the
          # wheel dropped fails here instead of on every instance's restart after `limn update`.
          "$python_dir/bin/python" -c "from limn import server; from limn.viewer import mark; v = server.read_viewer(); assert sorted(v.icons) == sorted(mark.ICON_ROUTES), sorted(v.icons); print('startup read:', len(v.icons), 'icons,', len(v.template), 'bytes of page')"

          if find "$python_dir" -path "*/limn/*" \( -path "*/tests/*" -o -name "test_*.py" \) | grep -q .; then
            echo "test files leaked into the installed package"
            exit 1
          fi

  tex:
    # The tests that run real TeX-side tools (the `tex` marker, tests/support/helpers.py needs_tex): real latexmk builds and
    # page renders, pick end to end, --git-pull builds and the bwrap-sandboxed comparison builds. The other jobs have no
    # TeX, so those tests skip there; here LIMN_TEST_REQUIRE_TEX=1 makes a missing tool a failure.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      LIMN_TEST_REQUIRE_TEX: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.23"
          python-version: "3.12"
      # The same apt settings as the browser parts' (see browser.yml).
      - name: Point apt at the main Ubuntu archive
        run: |
          printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          printf '%s\n' 'Acquire::Retries "3";' 'Acquire::https::Timeout "30";' 'Acquire::http::Timeout "30";' \
            | sudo tee /etc/apt/apt.conf.d/80-ci-timeouts >/dev/null
      - name: Install TeX, Poppler and bubblewrap
        timeout-minutes: 10
        # texlive-publishers holds the publisher document classes (IEEEtran) that the search corpus
        # (src/limn/viewer/tests/search_corpus.py) builds a real journal page with. That class sets its text in
        # Times: the font definitions (ot1ptm.fd, ts1ptm.fd) come with texlive-latex-base, already here, but the
        # metrics and Type 1 files (ptmr8r.tfm, utmr8a.pfb) are in texlive-fonts-recommended, which nothing here
        # depends on - apt only recommends it, and this install takes no recommendations. texlive-latex-recommended
        # is not named because texlive-publishers depends on it. A corpus case names the class file it needs and
        # needs_tex_files fails the job if the file is not here, so this list and the corpus cannot drift apart.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            latexmk texlive-latex-base texlive-plain-generic texlive-xetex texlive-publishers \
            texlive-fonts-recommended latexdiff poppler-utils bubblewrap
      - name: Let bwrap create user namespaces
        # Ubuntu 24.04 (kernel.apparmor_restrict_unprivileged_userns=1) denies unprivileged user namespaces to any
        # program without an AppArmor profile that grants them, and bwrap then fails at its first step ("loopback:
        # Failed RTM_NEWADDR"). This grants userns to /usr/bin/bwrap only, the way Ubuntu does for other sandboxing
        # programs; the sysctl and bwrap's own arguments stay as they are.
        run: |
          sudo tee /etc/apparmor.d/bwrap >/dev/null <<'PROFILE'
          abi <abi/4.0>,
          include <tunables/global>
          profile bwrap /usr/bin/bwrap flags=(unconfined) {
            userns,
          }
          PROFILE
          sudo apparmor_parser -r /etc/apparmor.d/bwrap
          sysctl kernel.apparmor_restrict_unprivileged_userns
          bwrap --unshare-all --ro-bind / / true
      - name: Install dev dependencies
        run: uv sync --group dev --locked
      - name: TeX tests
        run: uv run pytest -q -rs -n 2 -m tex -o faulthandler_timeout=600
