name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# A new PR revision supersedes that PR's older read-only checks. Main and tag
# runs keep a unique group so every integration and release tree is validated.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

# Every job reads only. Third-party actions are pinned to a commit SHA (the tag in the comment is for people and
# Dependabot), and checkout keeps no token in .git/config: no step pushes or fetches after it
# (tests/architecture/test_ci_pins.py).
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Install dev dependencies
        run: uv sync --group dev --locked
      - name: Ruff
        run: uv run ruff check
      - name: Ruff format
        run: uv run ruff format --check
      - name: ShellCheck
        run: uv run shellcheck src/limn/administration/instances.sh src/limn/administration/instance_*.sh src/limn/administration/tests/test_instances.sh
      - name: Mypy
        run: uv run mypy
      # Contributors type-check on macOS too, where the standard library declares fewer names (os.sched_getaffinity):
      # check that platform from here as well, so a checkout is clean on both.
      - name: Mypy (as on macOS)
        run: uv run mypy --platform darwin
      - name: Feature boundaries
        run: uv run python tools/check_boundaries.py
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Install viewer type checker
        run: npm ci --ignore-scripts
      - name: Viewer type check
        run: npm run typecheck
      - name: Viewer strict ratchet
        run: uv run python tools/strict_ratchet.py

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
        suite:
          - name: core
            markers: "not browser and not tex"
            workers: 4
          - name: browser
            markers: "browser"
            workers: 2
    env:
      # Browser layout tests must run here, not skip.
      LIMN_TEST_REQUIRE_BROWSER: ${{ matrix.suite.name == 'browser' && '1' || '0' }}
      # So must the node --check of the served page's inline scripts (src/limn/viewer/tests/test_viewer_files.py): node 22 is set up below.
      LIMN_TEST_REQUIRE_NODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history and tags: the v0.1.0 migration and v0.2.2 comparison tests load those releases with git show.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Install dev dependencies
        run: uv sync --group dev --locked
      - name: Install Playwright Chromium
        if: matrix.suite.name == 'browser'
        run: uv run playwright install --with-deps chromium
      - name: Python tests
        run: uv run pytest -q -rs -n ${{ matrix.suite.workers }} -m "${{ matrix.suite.markers }}"

  macos:
    # macOS semantics for tests that need no TeX or Chromium: BSD
    # userland (stat -f, no timeout(1)), /bin/bash 3.2 as the bash limn and the tests find first, and a system
    # python3 older than requires-python (issue #12). The Linux jobs cover bash 5 and the browser tests.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
      - name: Install dev dependencies
        run: uv sync --group dev --locked
      - name: Put /bin/bash 3.2 first on PATH
        run: |
          mkdir -p "$RUNNER_TEMP/bash32"
          ln -sf /bin/bash "$RUNNER_TEMP/bash32/bash"
          echo "$RUNNER_TEMP/bash32" >> "$GITHUB_PATH"
      - name: Show the tools under test
        run: |
          bash --version | head -1
          /usr/bin/python3 --version || true
          command -v timeout || echo "no timeout(1)"
          stat -f %Lp README.md
      - name: Python tests
        run: uv run pytest -q -rs -n 2 -m "not browser and not tex"

  instances:
    # Machine-wide dependencies are replaced at the owned shell adapter; each run has its own temporary tree.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
      - name: Install dev dependencies
        run: uv sync --group dev --locked
      - name: Instance manager tests
        run: bash src/limn/administration/tests/test_instances.sh

  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Install as a uv tool from the checkout
        run: uv tool install .
      - name: Smoke-test the installed command
        run: |
          limn version
          limn serve --help | head -3
          limn serve --version
          limn help | head -5
          python_dir=$(uv tool dir)/dartwork-limn
          # Each missing file fails the step (a `find | grep -q . && echo` line only fails it when it is the last one).
          for f in vendor/pdfjs/pdf.min.mjs vendor/pretendard/LICENSE vendor/pretendard/pretendard.css \
                   vendor/pretendard/PretendardVariable.subset.0.woff2 administration/systemd/limn@.service administration/instances.sh \
                   administration/instance_update.sh administration/instance_documents.sh \
                   administration/instance_lifecycle.sh administration/instance_inspection.sh \
                   viewer/index.html viewer/parts.txt viewer/css/tokens.css viewer/js/events.js \
                   viewer/brand/SHA256SUMS viewer/brand/favicon.ico viewer/brand/favicon-16.png viewer/brand/favicon-32.png viewer/brand/apple-touch-icon.png \
                   viewer/brand/limn-wordmark-light-20.svg; do
            find "$python_dir" -path "*limn/$f" | grep -q . || { echo "not packaged: $f"; exit 1; }
            echo "packaged: $f"
          done
          # Every Pretendard slice the stylesheet names, byte for byte: SHA256SUMS lists them all, so a slice the wheel
          # dropped fails here instead of drawing its characters in a fallback font.
          fonts=$(dirname "$(find "$python_dir" -path "*limn/vendor/pretendard/SHA256SUMS")")
          (cd "$fonts" && sha256sum --check --quiet SHA256SUMS) || { echo "Pretendard slices missing or changed"; exit 1; }
          echo "packaged: $(wc -l < "$fonts/SHA256SUMS") Pretendard slices"
          # What start() reads before it serves: the viewer package and every brand file limn.viewer.mark names. A file the
          # wheel dropped fails here instead of on every instance's restart after `limn update`.
          "$python_dir/bin/python" -c "from limn import server; from limn.viewer import mark; v = server.read_viewer(); assert sorted(v.icons) == sorted(mark.ICON_ROUTES), sorted(v.icons); print('startup read:', len(v.icons), 'icons,', len(v.template), 'bytes of page')"

          if find "$python_dir" -path "*/limn/*" \( -path "*/tests/*" -o -name "test_*.py" \) | grep -q .; then
            echo "test files leaked into the installed package"
            exit 1
          fi

  tex:
    # The tests that run real TeX-side tools (the `tex` marker, tests/support/helpers.py needs_tex): real latexmk builds and
    # page renders, pick end to end, --git-pull builds and the bwrap-sandboxed comparison builds. The other jobs have no
    # TeX, so those tests skip there; here LIMN_TEST_REQUIRE_TEX=1 makes a missing tool a failure.
    runs-on: ubuntu-24.04
    env:
      LIMN_TEST_REQUIRE_TEX: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
      - name: Install TeX, Poppler and bubblewrap
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            latexmk texlive-latex-base texlive-plain-generic texlive-xetex latexdiff poppler-utils bubblewrap
      - name: Let bwrap create user namespaces
        # Ubuntu 24.04 (kernel.apparmor_restrict_unprivileged_userns=1) denies unprivileged user namespaces to any
        # program without an AppArmor profile that grants them, and bwrap then fails at its first step ("loopback:
        # Failed RTM_NEWADDR"). This grants userns to /usr/bin/bwrap only, the way Ubuntu does for other sandboxing
        # programs; the sysctl and bwrap's own arguments stay as they are.
        run: |
          sudo tee /etc/apparmor.d/bwrap >/dev/null <<'PROFILE'
          abi <abi/4.0>,
          include <tunables/global>
          profile bwrap /usr/bin/bwrap flags=(unconfined) {
            userns,
          }
          PROFILE
          sudo apparmor_parser -r /etc/apparmor.d/bwrap
          sysctl kernel.apparmor_restrict_unprivileged_userns
          bwrap --unshare-all --ro-bind / / true
      - name: Install dev dependencies
        run: uv sync --group dev --locked
      - name: TeX tests
        run: uv run pytest -q -rs -n 2 -m tex
