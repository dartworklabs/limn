name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install dev dependencies
        run: uv sync --group dev --locked
      - name: Ruff
        run: uv run ruff check
      - name: Ruff format
        run: uv run ruff format --check
      - name: ShellCheck
        run: uv run shellcheck src/limn/instances.sh src/limn/features/administration/instance_*.sh tests/test_instances.sh
      - name: Mypy (modules moved out of server.py)
        run: uv run mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    env:
      # Browser layout tests must run here, not skip.
      LIMN_TEST_REQUIRE_BROWSER: "1"
      # So must the node --check of the served page's inline scripts (tests/test_viewer_files.py): node 22 is set up below.
      LIMN_TEST_REQUIRE_NODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history and tags: the v0.1.0 migration and v0.2.2 comparison tests load those releases with git show.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dev dependencies
        run: uv sync --group dev --locked
      - name: Install Playwright Chromium
        run: uv run playwright install --with-deps chromium
      - name: Python tests
        run: uv run pytest -q -rs -n 4 --dist loadscope
      - name: Instance manager tests
        run: bash tests/test_instances.sh

  macos:
    # macOS semantics for the instance manager and the tests that need no TeX or Chromium (those skip here): BSD
    # userland (stat -f, no timeout(1)), /bin/bash 3.2 as the bash limn and the tests find first, and a system
    # python3 older than requires-python (issue #12). The Linux jobs cover bash 5 and the browser tests.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install dev dependencies
        run: uv sync --group dev --locked
      - name: Put /bin/bash 3.2 first on PATH
        run: |
          mkdir -p "$RUNNER_TEMP/bash32"
          ln -sf /bin/bash "$RUNNER_TEMP/bash32/bash"
          echo "$RUNNER_TEMP/bash32" >> "$GITHUB_PATH"
      - name: Show the tools under test
        run: |
          bash --version | head -1
          /usr/bin/python3 --version || true
          command -v timeout || echo "no timeout(1)"
          stat -f %Lp README.md
      - name: Python tests
        run: uv run pytest -q -rs -n 2 --dist loadscope
      - name: Instance manager tests
        run: bash tests/test_instances.sh

  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install as a uv tool from the checkout
        run: uv tool install .
      - name: Smoke-test the installed command
        run: |
          limn version
          limn serve --help | head -3
          limn serve --version
          limn help | head -5
          python_dir=$(uv tool dir)/dartwork-limn
          # Each missing file fails the step (a `find | grep -q . && echo` line only fails it when it is the last one).
          for f in vendor/pdfjs/pdf.min.mjs systemd/limn@.service instances.sh \
                   features/administration/instance_update.sh features/administration/instance_documents.sh \
                   features/administration/instance_lifecycle.sh features/administration/instance_inspection.sh \
                   viewer/index.html viewer/parts.txt viewer/css/tokens.css viewer/js/events.js \
                   brand/SHA256SUMS brand/favicon.ico brand/favicon-dark.ico brand/apple-touch-icon.png \
                   brand/limn-wordmark-light-20.svg; do
            find "$python_dir" -path "*limn/$f" | grep -q . || { echo "not packaged: $f"; exit 1; }
            echo "packaged: $f"
          done
          # What start() reads before it serves: the viewer package and every brand file limn.mark names. A file the
          # wheel dropped fails here instead of on every instance's restart after `limn update`.
          "$python_dir/bin/python" -c "from limn import mark, server; v = server.read_viewer(); assert sorted(v.icons) == sorted(mark.ICON_ROUTES), sorted(v.icons); print('startup read:', len(v.icons), 'icons,', len(v.template), 'bytes of page')"

  tex:
    # The tests that run real TeX-side tools (the `tex` marker, tests/helpers.py needs_tex): real latexmk builds and
    # page renders, pick end to end, --git-pull builds and the bwrap-sandboxed comparison builds. The other jobs have no
    # TeX, so those tests skip there; here LIMN_TEST_REQUIRE_TEX=1 makes a missing tool a failure.
    runs-on: ubuntu-24.04
    env:
      LIMN_TEST_REQUIRE_TEX: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install TeX, Poppler and bubblewrap
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            latexmk texlive-latex-base texlive-plain-generic latexdiff poppler-utils bubblewrap
      - name: Let bwrap create user namespaces
        # Ubuntu 24.04 (kernel.apparmor_restrict_unprivileged_userns=1) denies unprivileged user namespaces to any
        # program without an AppArmor profile that grants them, and bwrap then fails at its first step ("loopback:
        # Failed RTM_NEWADDR"). This grants userns to /usr/bin/bwrap only, the way Ubuntu does for other sandboxing
        # programs; the sysctl and bwrap's own arguments stay as they are.
        run: |
          sudo tee /etc/apparmor.d/bwrap >/dev/null <<'PROFILE'
          abi <abi/4.0>,
          include <tunables/global>
          profile bwrap /usr/bin/bwrap flags=(unconfined) {
            userns,
          }
          PROFILE
          sudo apparmor_parser -r /etc/apparmor.d/bwrap
          sysctl kernel.apparmor_restrict_unprivileged_userns
          bwrap --unshare-all --ro-bind / / true
      - name: Install dev dependencies
        run: uv sync --group dev --locked
      - name: TeX tests
        run: uv run pytest -q -rs -n 2 --dist loadscope -m tex
