name: Fonts probe (temporary, removed before merge)

# Compares the fonts a browser part had when it installed all three engines' system packages with the fonts it has with
# Chromium's alone. Removed before this pull request merges.
on:
  pull_request:

permissions:
  contents: read

jobs:
  fonts:
    name: fonts (${{ matrix.engines }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        engines: ["chromium firefox webkit", "chromium"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.23"
          python-version: "3.12"
      - name: Install dev dependencies
        run: uv sync --group dev --locked
      - name: Point apt at the main Ubuntu archive
        run: |
          printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          printf '%s\n' 'Acquire::Retries "3";' 'Acquire::https::Timeout "30";' 'Acquire::http::Timeout "30";' \
            | sudo tee /etc/apt/apt.conf.d/80-ci-timeouts >/dev/null
      - name: Install the system packages
        timeout-minutes: 10
        run: uv run playwright install-deps ${{ matrix.engines }}
      - name: List the fonts
        run: |
          fc-list : family style file | LC_ALL=C sort > fonts.txt
          wc -l fonts.txt
          sha256sum fonts.txt
          cat fonts.txt
          for f in 'Noto Sans CJK KR' 'WenQuanYi Zen Hei' 'DejaVu Sans' sans-serif monospace; do echo "$f -> $(fc-match "$f")"; done
